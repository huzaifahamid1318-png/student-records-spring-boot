<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Student' : 'Add New Student'">Student Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f6fb;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .form-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }
        .form-header {
            background: radial-gradient(circle at top right, #312e81 0%, #1e1b4b 55%, #0f172a 100%);
            padding: 26px 28px;
            color: white;
        }
        .form-header h1 { font-size: 20px; font-weight: 800; }
        .form-header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
        .form-body { padding: 26px 28px; }

        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
        }
        input {
            font-family: inherit;
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            color: #0f172a;
            background: #f8fafc;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            background: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }
        input[readonly] {
            background-color: #eef2ff;
            color: #4f46e5;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            border-color: #c7d2fe;
            cursor: not-allowed;
        }

        .error-alert {
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13.5px;
            font-weight: 600;
            border: 1px solid #fecaca;
        }
        .btn-row { display: flex; gap: 10px; margin-top: 24px; }
        button, .btn {
            font-family: inherit;
            padding: 11px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: all 0.18s;
        }
        .btn-submit { background: #4f46e5; color: white; flex: 1; }
        .btn-submit:hover { background: #4338ca; }
        .btn-cancel { background: #f1f5f9; color: #475569; }
        .btn-cancel:hover { background: #e2e8f0; color: #0f172a; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <h1 th:text="${isEdit} ? 'Edit Student Record' : 'Register New Student'"></h1>
            <p th:text="${isEdit} ? 'Update academic details in MySQL database' : 'Enter student details to store permanently'"></p>
        </div>

        <div class="form-body">
            <div th:if="${error != null}" class="error-alert" th:text="${error}"></div>

            <form th:action="${isEdit} ? @{/students/{regNo}/update(regNo=${student.regNo})} : @{/students}" method="post">
                <div class="form-group">
                    <label for="regNo">Registration Number</label>
                    <input type="text" id="regNo" name="regNo" th:value="${student.regNo}"
                           th:readonly="${isEdit}" placeholder="e.g. REG-2026-009" required>
                </div>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" th:value="${student.name}" placeholder="e.g. Ahmed Raza" required>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" name="department" th:value="${student.department}" placeholder="e.g. CS, SE, AI, DS" required>
                </div>

                <div class="form-group">
                    <label for="cgpa">CGPA (0.00 – 4.00)</label>
                    <input type="number" step="0.01" min="0" max="4" id="cgpa" name="cgpa" th:value="${student.cgpa}" placeholder="e.g. 3.50" required>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn-submit" th:text="${isEdit} ? 'Save Changes' : 'Create Record'"></button>
                    <a href="/students" class="btn btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
